{{intro}}
{{sky}}

<section class="drop-hero">
  <div class="hero-card" style="left:calc(50% + 30vw);top:24%;rotate:12deg" data-parallax="-0.25" data-parallax-origin="center" data-sway="14" aria-hidden="true">{{card}}</div>
  <h1 class="drop-title" data-drop-title>Creatives</h1>
  <p class="drop-hero__sub" data-reveal style="--delay:0.9s">Web design, apparel, video and one cartridge still compiling</p>
  <p class="drop-hero__hint" data-reveal style="--delay:1.1s">Scroll to play, or use the console: the d-pad and <kbd>&larr;</kbd> <kbd>&rarr;</kbd> change cartridge.</p>
</section>

<!-- The console: boots to NOW PLAYING, scroll highlights each project and opens its gallery.
     Each project's description rises from below the console and parts around it. -->
<section class="arcade" data-arcade aria-label="Creative projects">
  <div class="arcade__stage">
    <div class="flow" data-flow aria-hidden="true"></div>
    <div class="gameboy__device" data-device>
      {{> console}}
      <div class="gameboy__screen" data-screen></div>
      <div class="gameboy__actions">
        <a class="gameboy__play" href="#" data-play data-magnetic>Play Now</a>
      </div>
      <!-- the console's own buttons: the d-pad changes cartridge, A plays, B goes back -->
      <div class="gameboy__keys" role="group" aria-label="Console controls">
        <button type="button" class="key-hit key-hit--up" data-console-key="up" aria-label="Previous project"></button>
        <button type="button" class="key-hit key-hit--down" data-console-key="down" aria-label="Next project"></button>
        <button type="button" class="key-hit key-hit--left" data-console-key="left" aria-label="Previous project"></button>
        <button type="button" class="key-hit key-hit--right" data-console-key="right" aria-label="Next project"></button>
        <button type="button" class="key-hit key-hit--a" data-console-key="a" aria-label="A: play"></button>
        <button type="button" class="key-hit key-hit--b" data-console-key="b" aria-label="B: back to the menu"></button>
        <button type="button" class="key-hit key-hit--select" data-console-key="select" aria-label="Select: next cartridge"></button>
        <button type="button" class="key-hit key-hit--start" data-console-key="start" aria-label="Start: open the gallery"></button>
      </div>
    </div>
  </div>
  <ul class="sr-only">
    {{sr_projects}}
  </ul>
  <script type="application/json" data-arcade-projects>{{arcade_json}}</script>
  <script type="application/json" data-flow-text>{{flow_json}}</script>
</section>

{{footer}}
