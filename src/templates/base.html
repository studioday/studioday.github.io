<link rel="stylesheet" href="/assets/css/site.css?v={{css_ver}}">
<script>
document.documentElement.classList.add("js");
// A card returning to the deck flies above the others until it lands: name the page we came from.
// Runs in the head because pagereveal fires before the first render.
// The page we came from is kept too (a file opened from the Tech folder lands with its title settled).
addEventListener("pagereveal", (e) => {
  const from = e.viewTransition && window.navigation && navigation.activation && navigation.activation.from;
  if (!from) return;
  const path = new URL(from.url).pathname;
  document.documentElement.dataset.vtFrom = path;
  const card = { academic: "king", creative: "queen", tech: "jack" }[path.split("/")[1]];
  if (!card) return;
  document.documentElement.dataset.vtCard = card;
  e.viewTransition.finished.finally(() => delete document.documentElement.dataset.vtCard);
});
</script>
{{head_extra}}
</head>
<body class="{{body_class}}" data-phase="{{phase}}">
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{content}}
</main>
<script type="module" src="/assets/{{js_dir}}/main.js"></script>
</body>
</html>
